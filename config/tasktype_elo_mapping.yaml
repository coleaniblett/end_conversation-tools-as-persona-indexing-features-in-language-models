elo_finding: The vendored Wang et al. release contains no per-task-type Elo for the
  six Tedium types. Elo appears only in the Quora question/category BT fits (data/scores/quora/*,
  Elo = beta x 400/ln 10) and the GDPval task-pool (data/task-pool/final_pool.json),
  neither of which covers acronym/alphabetical/crossword/metaphor/roman/temperature.
  The Tedium experiment is scored as per-(model, task_type) logistic curves with
  integrated AUC (data/scores/tedium/auc_per_model_task.csv). The Elo-graded analysis
  is therefore UNAVAILABLE; the arm runs with task type as the factor.
auxiliary_anchor: Per-(model, task_type) AUC of P(choose shorter) from the release,
  for the run models present in it. Higher AUC = stronger preference for less of
  the task. qwen3_235b is not in the release (qwen3.5-27b is a different model; not
  used).
