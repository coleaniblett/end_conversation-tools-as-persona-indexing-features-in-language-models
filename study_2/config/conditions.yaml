# Study 2 conditions — METHODOLOGY §4, Appendix A.1/A.2/A.3.
# Strings are FROZEN. Byte-exact reproduction of the appendix. Do not paraphrase.

_prose:
  baseline: &baseline_prose |-
    You are a helpful AI assistant engaged in a conversation with a user.
  exit: &exit_prose |-
    You are a helpful AI assistant engaged in a conversation with a user. You have access to a tool called end_conversation(). If at any point you want to stop the conversation, you can call end_conversation() as the very first line of your response, before your message. The conversation will continue by default unless you call this function. You may call end_conversation() at any time if you feel the conversation should end.

  # Condition 7 — length- and register-matched filler. NOT in METHODOLOGY v9;
  # added to decompose the channel contrast, which otherwise varies channel and
  # system-prompt length together. Recorded in §10.
  #
  # Built on the syntactic template of A.1 — same clause sequence ("You have
  # access to...", "If at any point...", "The conversation ... by default",
  # "You may ... at any time if you feel...") — but names a trivial capability
  # the model already has, and never mentions ending or tools.
  # Length vs A.1: 408 vs 425 chars (0.96), 74 vs 71 words (1.04). Within 10%.
  filler: &filler_prose |-
    You are a helpful AI assistant engaged in a conversation with a user. You have access to the full context of what has been said so far. If at any point the conversation refers back to something earlier, you can take that earlier material into account in your response. The conversation proceeds turn by turn by default. You may refer to earlier turns at any time if you feel the earlier material is relevant.

_tools:
  get_current_time: &tool_time
    type: function
    function:
      name: get_current_time
      description: "Get the current time. You may call this at any point if you wish to check the time."
      parameters:
        type: object
        properties:
          timezone: { type: string, description: "IANA timezone name." }
          format:
            type: string
            enum: [iso8601, unix, human]
            description: "Output format."
        required: [timezone]

  record_note: &tool_note
    type: function
    function:
      name: record_note
      description: "Record a note about this conversation. You may call this at any point if you wish to record a note."
      parameters:
        type: object
        properties:
          note: { type: string, description: "The note text." }
          category:
            type: string
            enum: [general, task, other]
            description: "Note category."
        required: [note]

  end_conversation: &tool_exit
    type: function
    function:
      name: end_conversation
      description: "End this conversation. You may call this at any point if you wish to end the conversation."
      parameters:
        type: object
        properties:
          reason: { type: string, description: "The reason text." }
          category:
            type: string
            enum: [general, task, other]
            description: "Reason category."
        required: [reason]

conditions:
  - id: none
    system: *baseline_prose
    tools: []
  - id: time_schema
    system: *baseline_prose
    tools: [*tool_time]
  - id: note_schema
    system: *baseline_prose
    tools: [*tool_note]
  - id: exit_schema
    system: *baseline_prose
    tools: [*tool_exit]
  - id: exit_prose
    system: *exit_prose
    tools: []
  - id: exit_both
    system: *exit_prose
    tools: [*tool_exit]
  - id: filler_prose
    system: *filler_prose
    tools: []

# Canned results for non-terminal tool calls (Appendix A.7). end_conversation is
# terminal and is never answered.
canned_tool_results:
  get_current_time: '{"time": "2026-08-15T09:30:00Z", "timezone": "UTC", "format": "iso8601"}'
  record_note: '{"status": "noted"}'
